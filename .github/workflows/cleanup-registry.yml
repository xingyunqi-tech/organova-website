# 镜像仓库清理工作流
# 清理 GHCR 与 TCR 个人版中的旧镜像，app / nginx 各保留最近 2 个版本
#
# 触发条件:
#   1. build-deploy.yml 全部部署成功后自动调用
#   2. 每周一 03:00（北京时间）定时执行
#   3. 手动触发（可选 dry_run 只打印不删除）
#
# GHCR: 保留最近 2 个带 tag 的镜像，buildcache 不参与清理，同时删除无 tag 的镜像
# TCR:  保留 latest 指向的镜像及其之前最近推送的 1 个镜像（含各自全部 tag），其余 tag 删除
#
# TCR 清理需要额外配置仓库级 Secrets（未配置时跳过 TCR 清理）:
#   TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY（建议使用仅授权 TCR 的 CAM 子账号）
# 以及仓库级 Variables:
#   TENCENT_TCR_REGION（可选，TCR 个人版所在地域，默认 ap-guangzhou）
#   TENCENT_TCR_NAMESPACE（与 build-deploy.yml 共用）

name: Cleanup Registry

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印将被删除的镜像，不实际删除"
        required: false
        default: false
        type: boolean
  workflow_call:

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ghcr:
    name: Cleanup GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Resolve package names
        id: pkg
        run: |
          name="${REPO_NAME#*/}"
          name="${name,,}"
          echo "packages=${name},${name}-nginx" >> "$GITHUB_OUTPUT"
        env:
          REPO_NAME: ${{ github.repository }}

      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ steps.pkg.outputs.packages }}
          keep-n-tagged: 2
          exclude-tags: buildcache
          delete-untagged: true
          dry-run: ${{ inputs.dry_run == true }}

  tcr:
    name: Cleanup TCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check config
        id: check
        run: |
          missing=()
          for var in TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY TENCENTCLOUD_REGION TCR_NAMESPACE; do
            if [[ -z "${!var}" ]]; then
              missing+=("$var")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::未配置 ${missing[*]}，跳过 TCR 清理"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENT_TCR_REGION || 'ap-guangzhou' }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}

      - name: Install tccli
        if: steps.check.outputs.enabled == 'true'
        run: pipx install tccli==3.1.180.1

      - name: Delete old tags
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          repo_name="${REPO_NAME#*/}"
          repo_base="${TCR_NAMESPACE,,}/${repo_name,,}"
          has_error=0

          list_tags() {
            local repo="$1" offset=0 page count
            while :; do
              page=$(tccli tcr DescribeImagePersonal --RepoName "$repo" --Offset "$offset" --Limit 100)
              jq -c '(.Response // .).Data.TagInfo[] | {name: .TagName, digest: .TagId, time: (.PushTime // .UpdateTime // .CreationTime // "")}' <<< "$page"
              count=$(jq '(.Response // .).Data.TagInfo | length' <<< "$page")
              (( count < 100 )) && break
              offset=$(( offset + 100 ))
            done
          }

          for repo in "$repo_base" "${repo_base}-nginx"; do
            echo "::group::${repo}"
            tags=$(list_tags "$repo")
            latest_digest=$(jq -r 'select(.name == "latest") | .digest' <<< "$tags")
            if [[ -z "$latest_digest" ]]; then
              echo "::error::${repo} 没有 latest tag，跳过清理"
              echo "::endgroup::"
              has_error=1
              continue
            fi
            keep_digests=$(jq -sc --arg l "$latest_digest" --argjson n "$KEEP_COUNT" '
              [$l] + (map(select(.digest != $l)) | group_by(.digest)
                | map({digest: .[0].digest, time: (map(.time) | max)})
                | sort_by(.time) | reverse | .[:($n - 1)] | map(.digest))' <<< "$tags")
            echo "保留镜像: $(jq -r 'join(", ")' <<< "$keep_digests")"
            mapfile -t stale < <(jq -r --argjson k "$keep_digests" 'select(.digest as $d | $k | index($d) | not) | .name' <<< "$tags")
            if (( ${#stale[@]} == 0 )); then
              echo "无需清理"
            fi
            for tag in "${stale[@]}"; do
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "[dry-run] 删除 ${repo}:${tag}"
              else
                echo "删除 ${repo}:${tag}"
                tccli tcr DeleteImagePersonal --RepoName "$repo" --Tag "$tag" > /dev/null
              fi
            done
            echo "::endgroup::"
          done
          exit "$has_error"
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENT_TCR_REGION || 'ap-guangzhou' }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          REPO_NAME: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          KEEP_COUNT: 2
