# 构建与部署工作流
# 构建 Docker 镜像推送到 GHCR（部署阿里云 / 腾讯云时额外推送到 TCR 个人版），通过 SSH 部署到多云服务器
# 阿里云 ECS、腾讯云 CVM 从 TCR 拉取镜像，AWS EC2 从 GHCR 拉取
#
# 触发条件:
#   仅手动触发 (workflow_dispatch) → 选择目标
#
# GitHub 配置步骤:
#   在 Settings → Secrets and variables → Actions 中配置仓库级 Secrets:
#     ALIYUN_HOST  / ALIYUN_USER  / ALIYUN_PATH  / ALIYUN_SSH_KEY
#     AWS_HOST     / AWS_USER     / AWS_PATH     / AWS_SSH_KEY
#     TENCENT_HOST / TENCENT_USER / TENCENT_PATH / TENCENT_SSH_KEY
#     TENCENT_TCR_PASSWORD（TCR 个人版登录密码，阿里云与腾讯云部署共用）
#   在 Settings → Secrets and variables → Actions → Variables 中配置仓库级 Variables:
#     TENCENT_TCR_REGISTRY（如 ccr.ccs.tencentyun.com）
#     TENCENT_TCR_NAMESPACE（TCR 命名空间）
#     TENCENT_TCR_USERNAME（腾讯云账号 UIN）
#   TCR 中的镜像仓库为 <命名空间>/<仓库名> 与 <命名空间>/<仓库名>-nginx
#   全部部署成功后调用 cleanup-registry.yml 清理 GHCR / TCR 旧镜像（配置见该文件）
#   部署 job 使用的 Environments（aliyun-production / aws-production / tencent-production）首次运行时自动创建，
#   可在 Settings → Environments 中为其配置审批人或分支限制
#
# 注意: 迁移由 Docker CMD 自动执行 (node migrate.mjs)，无需 CI 单独处理
# 注意: 阿里云 ECS 自建 Postgres 需用宿主 IP 而非 localhost，详见 README

name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "部署目标"
        required: true
        default: "aliyun"
        type: choice
        options: [aliyun, aws, tencent, all]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== 预处理：确定部署目标 ====================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      deploy_aliyun: ${{ steps.targets.outputs.deploy_aliyun }}
      deploy_aws: ${{ steps.targets.outputs.deploy_aws }}
      deploy_tencent: ${{ steps.targets.outputs.deploy_tencent }}
      push_tcr: ${{ steps.targets.outputs.push_tcr }}
      git_ref: ${{ steps.targets.outputs.git_ref }}

    steps:
      # 仅允许部署默认分支上、且 Check Quality 已通过的提交
      - name: Verify branch and quality checks
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::仅允许从默认分支 $DEFAULT_BRANCH 部署，当前为 $REF_NAME"
            exit 1
          fi
          conclusion=$(gh run list --repo "${{ github.repository }}" \
            --workflow check-quality.yml --commit "${{ github.sha }}" --event push \
            --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::提交 ${{ github.sha }} 的 Check Quality 未通过（结果：${conclusion:-无记录或仍在运行}）"
            exit 1
          fi

      - name: Determine deploy targets
        id: targets
        run: |
          target="${{ github.event.inputs.target }}"

          deploy_aliyun=false
          deploy_aws=false
          deploy_tencent=false

          case "$target" in
            aliyun)  deploy_aliyun=true ;;
            aws)     deploy_aws=true ;;
            tencent) deploy_tencent=true ;;
            all)     deploy_aliyun=true; deploy_aws=true; deploy_tencent=true ;;
          esac

          echo "deploy_aliyun=${deploy_aliyun}" >> "$GITHUB_OUTPUT"
          echo "deploy_aws=${deploy_aws}" >> "$GITHUB_OUTPUT"
          echo "deploy_tencent=${deploy_tencent}" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_aliyun" == "true" || "$deploy_tencent" == "true" ]]; then
            echo "push_tcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_tcr=false" >> "$GITHUB_OUTPUT"
          fi
          echo "git_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Show plan
        run: |
          echo "### 部署计划" >> "$GITHUB_STEP_SUMMARY"
          echo "| 目标 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 阿里云 ECS | ${{ steps.targets.outputs.deploy_aliyun == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS EC2    | ${{ steps.targets.outputs.deploy_aws == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 腾讯云 CVM | ${{ steps.targets.outputs.deploy_tencent == 'true' && '✅ 部署' || '⏭️ 跳过' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ==================== 构建并推送到 GHCR ====================
  build:
    name: Build & Push
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_app: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ steps.info.outputs.git_hash }}
      image_nginx: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:${{ steps.info.outputs.git_hash }}
      image_app_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}:${{ steps.info.outputs.git_hash }}
      image_nginx_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}-nginx:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Normalize image name
        id: repo
        run: |
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          tcr_image_name="${TCR_NAMESPACE}/${REPO_NAME}"
          echo "tcr_image_name=${tcr_image_name,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Generate build info
        id: info
        run: |
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TCR config
        if: needs.prepare.outputs.push_tcr == 'true'
        run: |
          has_error=0
          for var in TENCENT_TCR_REGISTRY TENCENT_TCR_NAMESPACE TENCENT_TCR_USERNAME TENCENT_TCR_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${var}（在仓库 Actions Variables / Secrets 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          TENCENT_TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          TENCENT_TCR_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          TENCENT_TCR_PASSWORD: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Log in to TCR
        if: needs.prepare.outputs.push_tcr == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.TENCENT_TCR_REGISTRY }}
          username: ${{ vars.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract app metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }},enable=${{ needs.prepare.outputs.push_tcr == 'true' }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (app)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          target: runner
          build-args: |
            BUILD_ID=${{ steps.info.outputs.git_hash }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:buildcache,mode=max

      - name: Extract nginx metadata
        id: nginx-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}-nginx,enable=${{ needs.prepare.outputs.push_tcr == 'true' }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (nginx)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          target: nginx
          build-args: |
            BUILD_ID=${{ steps.info.outputs.git_hash }}
          tags: ${{ steps.nginx-meta.outputs.tags }}
          labels: ${{ steps.nginx-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-nginx:buildcache,mode=max

  # ==================== 部署到阿里云 ECS ====================
  deploy-aliyun:
    name: Deploy → 阿里云 ECS
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aliyun == 'true'
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
    with:
      environment: aliyun-production
      registry: ${{ vars.TENCENT_TCR_REGISTRY }}
      registry_username: ${{ vars.TENCENT_TCR_USERNAME }}
      image_app: ${{ needs.build.outputs.image_app_tcr }}
      image_nginx: ${{ needs.build.outputs.image_nginx_tcr }}
      git_ref: ${{ needs.prepare.outputs.git_ref }}
      enable_https: false
    secrets:
      HOST: ${{ secrets.ALIYUN_HOST }}
      USER: ${{ secrets.ALIYUN_USER }}
      DEPLOY_PATH: ${{ secrets.ALIYUN_PATH }}
      SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}

  # ==================== 部署到 AWS EC2 ====================
  deploy-aws:
    name: Deploy → AWS EC2
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_aws == 'true'
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: aws-production
      registry: ghcr.io
      registry_username: ${{ github.actor }}
      image_app: ${{ needs.build.outputs.image_app }}
      image_nginx: ${{ needs.build.outputs.image_nginx }}
      git_ref: ${{ needs.prepare.outputs.git_ref }}
      enable_https: true
    secrets:
      HOST: ${{ secrets.AWS_HOST }}
      USER: ${{ secrets.AWS_USER }}
      DEPLOY_PATH: ${{ secrets.AWS_PATH }}
      SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 部署到腾讯云 CVM ====================
  deploy-tencent:
    name: Deploy → 腾讯云 CVM
    needs: [prepare, build]
    if: needs.prepare.outputs.deploy_tencent == 'true'
    uses: ./.github/workflows/_deploy-server.yml
    permissions:
      contents: read
    with:
      environment: tencent-production
      registry: ${{ vars.TENCENT_TCR_REGISTRY }}
      registry_username: ${{ vars.TENCENT_TCR_USERNAME }}
      image_app: ${{ needs.build.outputs.image_app_tcr }}
      image_nginx: ${{ needs.build.outputs.image_nginx_tcr }}
      git_ref: ${{ needs.prepare.outputs.git_ref }}
      enable_https: false
    secrets:
      HOST: ${{ secrets.TENCENT_HOST }}
      USER: ${{ secrets.TENCENT_USER }}
      DEPLOY_PATH: ${{ secrets.TENCENT_PATH }}
      SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}

  # ==================== 清理镜像仓库 ====================
  cleanup:
    name: Cleanup Registry
    needs: [prepare, build, deploy-aliyun, deploy-aws, deploy-tencent]
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/cleanup-registry.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ==================== 汇总通知 ====================
  notify:
    name: Notify
    needs: [prepare, build, deploy-aliyun, deploy-aws, deploy-tencent, cleanup]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result != 'skipped'
    timeout-minutes: 5

    steps:
      - name: Summary
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 构建 & 推送 | ${{ needs.build.result }} |"
            echo "| 阿里云 ECS  | ${{ needs.deploy-aliyun.result }} |"
            echo "| AWS EC2     | ${{ needs.deploy-aws.result }} |"
            echo "| 腾讯云 CVM  | ${{ needs.deploy-tencent.result }} |"
            echo "| 镜像清理    | ${{ needs.cleanup.result }} |"
            echo ""
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "**App 镜像**: \`${{ needs.build.outputs.image_app }}\`"
              echo ""
              echo "**Nginx 镜像**: \`${{ needs.build.outputs.image_nginx }}\`"
              echo ""
              if [[ "${{ needs.prepare.outputs.push_tcr }}" == "true" ]]; then
                echo "**TCR App 镜像**: \`${{ needs.build.outputs.image_app_tcr }}\`"
                echo ""
                echo "**TCR Nginx 镜像**: \`${{ needs.build.outputs.image_nginx_tcr }}\`"
                echo ""
              fi
              echo "**构建时间**: ${{ needs.build.outputs.build_time }}"
            fi
            if [[ "${{ needs.deploy-aliyun.result }}" == "failure" || "${{ needs.deploy-aws.result }}" == "failure" || "${{ needs.deploy-tencent.result }}" == "failure" ]]; then
              echo ""
              echo "> **部署失败** — manage.sh 若检测到健康检查失败会自动回滚到上一版本"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
