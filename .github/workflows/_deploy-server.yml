# 可复用的单台服务器部署工作流
# 被 build-deploy.yml 中的 deploy-aliyun / deploy-aws / deploy-tencent 调用
name: Deploy to Server

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment 名称（如 aliyun-production）"
        required: true
        type: string
      registry:
        description: "镜像仓库地址（如 ghcr.io、ccr.ccs.tencentyun.com）"
        required: true
        type: string
      registry_username:
        description: "镜像仓库登录用户名"
        required: true
        type: string
      image_app:
        description: "App 镜像完整地址（含 tag）"
        required: true
        type: string
      image_nginx:
        description: "Nginx 镜像完整地址（含 tag）"
        required: true
        type: string
      git_ref:
        description: "用于 checkout 的 git ref"
        required: true
        type: string
      enable_https:
        description: "是否启用 HTTPS（叠加 docker-compose.https.yml，需要宿主机有 letsencrypt 证书）"
        required: false
        type: boolean
        default: false
    secrets:
      HOST:
        required: true
      USER:
        required: true
      DEPLOY_PATH:
        required: true
      SSH_KEY:
        required: true
      REGISTRY_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}

      - name: Verify secrets
        run: |
          has_error=0
          for var in HOST USER DEPLOY_PATH SSH_KEY REGISTRY_TOKEN; do
            val="${!var}"
            if [[ -z "$val" ]]; then
              echo "::error::缺少 ${var} secret（在 ${{ inputs.environment }} Environment 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Sync deploy files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "manage.sh,docker-compose.yml,docker-compose.https.yml,nginx.conf,nginx.https.conf,.env.example"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          envs: REGISTRY_TOKEN,IMAGE_APP,IMAGE_NGINX,ENABLE_HTTPS
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # 根据 enable_https 决定是否启用 HTTPS override：
            # 不启用时必须删除 https.yml 和 nginx.https.conf，否则 manage.sh 会自动叠加
            # 导致 443 端口绑定 / 证书路径解析失败
            if [ "${ENABLE_HTTPS}" != "true" ]; then
              rm -f docker-compose.https.yml nginx.https.conf
            fi
            chmod +x ./manage.sh
            trap 'docker logout "${{ inputs.registry }}" >/dev/null 2>&1 || true' EXIT
            echo "${REGISTRY_TOKEN}" | docker login "${{ inputs.registry }}" -u "${{ inputs.registry_username }}" --password-stdin
            ./manage.sh pull-deploy "${IMAGE_APP}" "${IMAGE_NGINX}"
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_APP: ${{ inputs.image_app }}
          IMAGE_NGINX: ${{ inputs.image_nginx }}
          ENABLE_HTTPS: ${{ inputs.enable_https }}
